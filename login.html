<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1rem;
        text-align: left;
      }

      .login-form label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #475569;
      }

      .login-form input {
        padding: 0.625rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }

      .login-form button {
        margin-top: 0.25rem;
        padding: 0.625rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .login-form button:hover {
        background: #1d4ed8;
      }

      .error {
        margin: 0;
        font-size: 0.875rem;
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Password required</h1>
      <p class="datetime">Enter the password to view this site.</p>
      <form class="login-form" id="login-form">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Continue</button>
        <p class="error" id="error" hidden>Incorrect password. Try again.</p>
      </form>
    </main>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("error");
        errorEl.hidden = true;

        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: document.getElementById("password").value,
          }),
        });

        if (res.ok) {
          window.location.href = "/";
          return;
        }

        errorEl.hidden = false;
      });
    </script>
  </body>
</html>
